# Spring Boot Server Configuration
server.port=8080
server.servlet.context-path=/api

# Supabase PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://db.[your-project-id].supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=[your-supabase-db-password]
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File Upload Sizes
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration Parameters
careerpilot.jwt.secret=CareerPilotAISecretKeySuperLongUniqueKeyThatIsSecureAndUsedForJWTSigning
# Expiration: 24 Hours in milliseconds
careerpilot.jwt.expiration=86400000

# OpenRouter / OpenAI API Integration
careerpilot.openai.api-key=[your-openrouter-api-key]
careerpilot.openai.model=gpt-oss-120b
careerpilot.openai.endpoint-url=https://openrouter.ai/api/v1/chat/completions
